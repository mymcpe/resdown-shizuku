name: Build APK from zip
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q resdown-shizuku.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Set API_BASE
        if: ${{ vars.API_BASE != '' }}
        run: sed -i "s#https://resdown-keys.YOUR-SUBDOMAIN.workers.dev#${{ vars.API_BASE }}#" resdown-shizuku/app/src/main/java/com/resdown/shizuku/Config.kt
      - name: Tắt key để test
        if: ${{ vars.REQUIRE_KEY == 'false' }}
        run: sed -i "s/REQUIRE_KEY = true/REQUIRE_KEY = false/" resdown-shizuku/app/src/main/java/com/resdown/shizuku/Config.kt
      - run: gradle assembleDebug
        working-directory: resdown-shizuku
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: resdown-shizuku/app/build/outputs/apk/debug/app-debug.apk
